<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { display: none; }
    @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
    .sos-pulse::before { content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 50%; background-color: #ef4444; animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; z-index: -1; }
  </style>
</head>
<body class="bg-[var(--background)] antialiased p-5 flex justify-center items-center min-h-screen">

  <div class="relative w-[400px] h-[800px] bg-gray-50 rounded-[3rem] shadow-2xl border-[8px] border-gray-900 overflow-hidden flex flex-col">
    <div class="absolute top-0 inset-x-0 h-7 bg-gray-900 w-40 mx-auto rounded-b-3xl z-50"></div>
    <div id="app-root" class="flex-1 overflow-y-auto relative pt-10"></div>
  </div>

  <script>
    let state = {
      screen: 'persona', phone: '', otp: '', activeTab: 'home', overlay: null, sosState: 'idle', roomStep: 1, moveStep: 1, leaveStep: 1
    };

    function render() {
      const root = document.getElementById('app-root');
      if (state.overlay) { root.innerHTML = renderOverlay(); } 
      else {
        if (state.screen === 'persona') root.innerHTML = renderPersonaPicker();
        else if (state.screen === 'login') root.innerHTML = renderLogin();
        else if (state.screen === 'home') root.innerHTML = renderHome();
        else if (state.screen === 'join') root.innerHTML = renderJoin();
        else if (state.screen === 'activation') root.innerHTML = renderActivation();
        else if (state.screen === 'dashboard') root.innerHTML = renderDashboard();
      }
      attachEvents();
    }

    function renderOverlay() {
      if (state.overlay === 'issues') return renderIssues();
      if (state.overlay === 'food') return renderFood();
      if (state.overlay === 'sos') return renderSOS();
      if (state.overlay === 'clean') return renderClean();
      if (state.overlay === 'laundry') return renderLaundry();
      if (state.overlay === 'roomchange') return renderRoomChange();
      if (state.overlay === 'moveout') return renderMoveOut();
      if (state.overlay === 'leave') return renderLeave();
      if (state.overlay === 'inbox') return renderInbox();
      return '';
    }

    // -- New Minor Overlays --
    function renderLeave() {
      if (state.leaveStep === 1) {
        return `
          <div class="p-6 flex flex-col h-full bg-gray-50 gap-6">
            <div class="flex items-center gap-3">
              <button data-action="close-overlay" class="text-blue-600 font-bold text-lg">← Back</button>
              <h2 class="text-2xl font-bold">Declare Leave</h2>
            </div>
            <p class="text-gray-500 font-medium text-sm">Tell your PG you'll be away. This automatically pauses your meals and cleaning.</p>
            <div class="flex flex-col gap-4 mt-2">
              <label class="font-bold text-gray-700 text-sm">Start Date</label>
              <input type="date" class="w-full p-4 border border-gray-300 rounded-2xl font-medium" />
              <label class="font-bold text-gray-700 text-sm mt-2">Return Date</label>
              <input type="date" class="w-full p-4 border border-gray-300 rounded-2xl font-medium" />
            </div>
            <div class="p-4 bg-yellow-50 rounded-2xl border border-yellow-200 mt-4">
              <p class="text-sm text-yellow-800 font-bold mb-1">Effects Preview:</p>
              <ul class="text-sm text-yellow-700 list-disc pl-4 space-y-1 font-medium">
                <li>Meals will be cancelled for these dates</li>
                <li>Cleaning slots will be skipped</li>
                <li>Manager will be notified</li>
              </ul>
            </div>
            <button data-action="submit-leave" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg mt-auto shadow-sm">Confirm Leave</button>
          </div>
        `;
      }
      return `
        <div class="p-6 flex flex-col h-full bg-gray-50 gap-6">
          <button data-action="close-overlay" class="text-blue-600 font-bold text-lg w-fit">← Back</button>
          <h2 class="text-2xl font-bold">Leave Status</h2>
          <div class="bg-white p-6 rounded-3xl border border-gray-200 shadow-sm flex flex-col gap-2">
            <span class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-bold uppercase w-fit">Approved</span>
            <h3 class="text-xl font-bold text-gray-900 mt-2">12 Oct - 18 Oct</h3>
            <p class="text-gray-500 font-medium text-sm">You are marked as on leave. Enjoy your trip!</p>
            <button class="w-full py-3 mt-3 bg-gray-100 text-gray-700 rounded-xl font-bold text-sm">I'm back early</button>
          </div>
        </div>
      `;
    }

    function renderInbox() {
      return `
        <div class="p-6 flex flex-col h-full bg-gray-50 gap-6">
          <div class="flex justify-between items-center">
            <button data-action="close-overlay" class="text-blue-600 font-bold text-lg">← Back</button>
            <h2 class="text-2xl font-bold">Inbox</h2>
            <div class="w-10"></div>
          </div>
          
          <div class="flex flex-col gap-3">
            <div class="bg-white p-4 border border-gray-200 rounded-2xl shadow-sm border-l-4 border-l-red-500">
              <div class="flex justify-between mb-1"><span class="font-bold text-red-600 text-xs uppercase tracking-wider">Urgent Notice</span><span class="text-xs text-gray-400">10:00 AM</span></div>
              <h4 class="font-bold text-gray-900">Power Outage Tomorrow</h4>
              <p class="text-sm text-gray-600 mt-1">Power will be cut from 2 PM to 5 PM for grid maintenance.</p>
              <button class="w-full py-2 bg-gray-100 text-gray-900 rounded-lg mt-3 font-bold text-sm">Acknowledge</button>
            </div>

            <div class="bg-white p-4 border border-gray-200 rounded-2xl shadow-sm opacity-70">
              <div class="flex justify-between mb-1"><span class="font-bold text-gray-500 text-xs uppercase tracking-wider">Rent</span><span class="text-xs text-gray-400">Yesterday</span></div>
              <h4 class="font-bold text-gray-900">Receipt Generated</h4>
              <p class="text-sm text-gray-600 mt-1">Your payment of ₹8,500 has been confirmed.</p>
            </div>
          </div>
        </div>
      `;
    }

    // -- Screens --
    function renderDashboard() {
      const isHome = state.activeTab === 'home';
      const isRent = state.activeTab === 'rent';
      const isProfile = state.activeTab === 'profile';

      let content = '';

      if (isHome) {
        content = `
          <div class="flex justify-between items-center mb-2">
            <div><h2 class="text-2xl font-bold">Sunrise PG</h2><p class="text-gray-500 font-medium">Room 204B, Tower A</p></div>
            <div class="flex gap-2">
              <button data-action="open-inbox" class="w-12 h-12 bg-white border border-gray-200 rounded-full flex items-center justify-center text-xl shadow-sm relative"><span class="absolute top-0 right-0 w-3 h-3 bg-red-500 border-2 border-white rounded-full"></span>🔔</button>
              <button data-action="open-sos" class="w-12 h-12 bg-red-100 text-red-600 border border-red-200 rounded-full flex items-center justify-center text-xs font-bold">SOS</button>
            </div>
          </div>
          <div class="bg-white p-6 rounded-3xl border border-gray-200 shadow-sm mt-4">
            <p class="text-gray-500 font-semibold uppercase text-xs mb-1">Rent Due</p><h3 class="text-3xl font-bold text-red-600">₹8,500</h3>
          </div>
          <div class="mt-6">
            <h4 class="text-lg font-bold text-gray-900 mb-4">Quick Actions</h4>
            <div class="grid grid-cols-3 gap-3">
              <button data-action="open-issues" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center gap-2 active:scale-95"><span class="text-2xl">🎫</span><span class="text-xs font-bold">Issue</span></button>
              <button data-action="open-food" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center gap-2 active:scale-95"><span class="text-2xl">🍲</span><span class="text-xs font-bold">Menu</span></button>
              <button data-action="open-clean" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center gap-2 active:scale-95"><span class="text-2xl">✨</span><span class="text-xs font-bold">Clean</span></button>
              <button data-action="open-leave" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center gap-2 active:scale-95"><span class="text-2xl">✈️</span><span class="text-xs font-bold">Leave</span></button>
              <button data-action="open-laundry" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center gap-2 active:scale-95"><span class="text-2xl">👕</span><span class="text-xs font-bold">Laundry</span></button>
              <button data-action="open-roomchange" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center gap-2 active:scale-95"><span class="text-2xl">🛏️</span><span class="text-xs font-bold">Room</span></button>
              <button class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center gap-2 active:scale-95"><span class="text-2xl">📶</span><span class="text-xs font-bold">WiFi</span></button>
              <button data-action="open-moveout" class="bg-red-50 p-4 rounded-2xl shadow-sm border border-red-100 flex flex-col items-center gap-2 active:scale-95 col-span-2"><span class="text-xl">👋</span><span class="text-xs font-bold text-red-700">Exit PG</span></button>
            </div>
          </div>
        `;
      } else if (isRent) {
        content = `<h2 class="text-2xl font-bold mb-4">Rent & Payments</h2><div class="bg-red-50 p-6 rounded-3xl border border-red-100 flex flex-col gap-4 mb-6"><div><h3 class="text-3xl font-bold text-red-600">₹8,500</h3><p class="text-red-700 font-medium text-sm mt-1">Overdue (Oct 5th)</p></div><button class="w-full py-4 bg-red-600 text-white rounded-2xl font-bold">Pay Now</button></div>`;
      } else if (isProfile) {
        content = `
          <h2 class="text-2xl font-bold mb-4">Profile</h2>
          <div class="bg-white p-5 border border-gray-200 rounded-2xl shadow-sm flex items-center gap-4 mb-6">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-2xl">R</div>
            <div><h3 class="font-bold text-gray-900 text-lg">Rohit Verma</h3><p class="text-gray-500 font-medium">+91 9999999999</p></div>
          </div>
          <div class="flex flex-col gap-3">
            <div class="bg-white p-4 border border-gray-200 rounded-2xl shadow-sm flex justify-between items-center font-bold text-gray-700"><span>📄 My Documents</span><span class="text-gray-400">→</span></div>
            <div class="bg-white p-4 border border-gray-200 rounded-2xl shadow-sm flex justify-between items-center font-bold text-gray-700"><span>🛡️ Privacy & Settings</span><span class="text-gray-400">→</span></div>
            <div class="bg-white p-4 border border-gray-200 rounded-2xl shadow-sm flex justify-between items-center font-bold text-gray-700"><span>🎁 Refer & Earn</span><span class="text-gray-400">→</span></div>
            <button data-action="nav-persona" class="bg-gray-100 p-4 border border-gray-200 rounded-2xl shadow-sm flex justify-center items-center font-bold text-gray-900 mt-4">Log Out</button>
          </div>
        `;
      }

      return `
        <div class="p-6 flex flex-col h-full overflow-y-auto pb-24">${content}</div>
        <div class="absolute bottom-0 inset-x-0 h-20 bg-white border-t border-gray-200 flex justify-around items-center px-6 pb-2 rounded-b-[3rem] z-20">
          <button data-action="tab-home" class="flex flex-col items-center gap-1 ${isHome ? 'text-blue-600' : 'text-gray-400'}"><span class="text-2xl">🏠</span><span class="text-[10px] font-bold">Home</span></button>
          <button data-action="tab-rent" class="flex flex-col items-center gap-1 ${isRent ? 'text-blue-600' : 'text-gray-400'}"><span class="text-2xl">💳</span><span class="text-[10px] font-bold">Payments</span></button>
          <button data-action="tab-profile" class="flex flex-col items-center gap-1 ${isProfile ? 'text-blue-600' : 'text-gray-400'}"><span class="text-2xl">👤</span><span class="text-[10px] font-bold">Profile</span></button>
        </div>
      `;
    }

    // Minified unchanged screens
    function renderRoomChange() { if (state.roomStep === 1) return `<div class="p-6 flex flex-col h-full bg-gray-50 gap-6"><div class="flex items-center gap-3"><button data-action="close-overlay" class="text-blue-600 font-bold text-lg">← Back</button><h2 class="text-2xl font-bold">Change Room</h2></div><button data-action="submit-room" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg mt-auto mb-6 shadow-sm">Submit Request</button></div>`; return `<div class="p-6 flex flex-col h-full bg-gray-50 gap-6"><button data-action="close-overlay" class="text-blue-600 font-bold text-lg w-fit">← Back</button><h2 class="text-2xl font-bold">Room Change Status</h2><div class="bg-white p-6 rounded-3xl border shadow-sm"><span class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-bold mb-2">Under Review</span></div></div>`; }
    function renderMoveOut() { if (state.moveStep === 1) return `<div class="p-6 flex flex-col h-full bg-gray-50 gap-6"><div class="flex items-center gap-3"><button data-action="close-overlay" class="text-blue-600 font-bold text-lg">← Back</button><h2 class="text-2xl font-bold">Move Out</h2></div><button data-action="submit-move" class="w-full py-4 bg-red-600 text-white rounded-2xl font-bold text-lg mt-auto shadow-sm">Submit Request</button></div>`; return `<div class="p-6 flex flex-col h-full bg-gray-50 gap-6"><button data-action="close-overlay" class="text-blue-600 font-bold text-lg w-fit">← Back</button><h2 class="text-2xl font-bold">Move Out Status</h2><div class="bg-red-50 p-6 rounded-3xl border shadow-sm"><h3 class="text-2xl font-bold text-red-700">14 Nov 2026</h3></div></div>`; }
    function renderSOS() { if (state.sosState === 'idle') return `<div class="p-6 flex flex-col h-full bg-red-50 gap-6 justify-center items-center text-center"><button data-action="close-overlay" class="absolute top-12 left-6 text-red-600 font-bold text-lg">← Back</button><div class="relative mb-12"><button data-action="trigger-sos" class="sos-pulse relative w-48 h-48 bg-red-600 rounded-full flex items-center justify-center active:scale-95"><span class="text-white font-bold text-4xl">SOS</span></button></div></div>`; return `<div class="p-6 flex flex-col h-full bg-red-600 gap-6 justify-center items-center text-center text-white"><h2 class="text-4xl font-bold mb-4">SOS Sent</h2><button data-action="cancel-sos" class="w-full py-4 bg-white text-red-600 rounded-2xl font-bold text-lg mt-auto mb-8">I'm safe (Close)</button></div>`; }
    function renderClean() { return `<div class="p-6"><button data-action="close-overlay" class="text-blue-600 font-bold text-lg mb-4">← Back</button><h2 class="text-2xl font-bold">Cleaning</h2><div class="bg-white p-6 rounded-3xl border shadow-sm"><h3 class="font-bold text-lg">Next Clean: 10AM</h3></div></div>`; }
    function renderLaundry() { return `<div class="p-6"><button data-action="close-overlay" class="text-blue-600 font-bold text-lg mb-4">← Back</button><h2 class="text-2xl font-bold">Laundry</h2><div class="bg-white p-5 border rounded-2xl shadow-sm"><h4>12 Items (Bag)</h4></div></div>`; }
    function renderIssues() { return `<div class="p-6"><button data-action="close-overlay" class="text-blue-600 font-bold text-lg mb-4">← Back</button><h2 class="text-2xl font-bold">Issues</h2><div class="bg-white p-5 border rounded-2xl shadow-sm"><h4>AC not cooling</h4></div></div>`; }
    function renderFood() { return `<div class="p-6"><button data-action="close-overlay" class="text-blue-600 font-bold text-lg mb-4">← Back</button><h2 class="text-2xl font-bold">Menu</h2><div class="bg-white p-5 border rounded-2xl shadow-sm"><b>Lunch (🔒 Locked)</b></div></div>`; }
    function renderPersonaPicker() { return `<div class="p-6 flex flex-col justify-center h-full gap-8"><div><h1 class="text-3xl font-bold mb-2">Who is using this app?</h1><p class="text-gray-500 font-medium">Select your role</p></div><button data-action="nav-tenant" class="p-5 bg-white border border-gray-200 rounded-2xl flex items-center justify-between shadow-sm"><span class="font-semibold text-lg text-gray-800">Tenant</span><span class="text-xl text-gray-400">→</span></button></div>`; }
    function renderLogin() { 
      if (!state.phoneStep || state.phoneStep === 1) return `<div class="p-6 flex flex-col h-full mt-8 gap-8"><button data-action="nav-persona" class="text-blue-600 font-semibold w-fit">← Back</button><div><h2 class="text-3xl font-bold mb-2">Welcome</h2></div><input id="phone-input" type="tel" class="w-full p-4 border border-gray-300 rounded-2xl text-xl" placeholder="10-digit mobile number" value="${state.phone}" maxlength="10" /><button data-action="send-otp" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg">Get OTP</button></div>`;
      return `<div class="p-6 flex flex-col h-full mt-8 gap-8"><button data-action="back-phone" class="text-blue-600 font-semibold w-fit">← Back</button><div><h2 class="text-3xl font-bold mb-2">Enter OTP</h2></div><input id="otp-input" type="number" class="w-full p-4 border border-gray-300 rounded-2xl text-2xl tracking-[0.5em] text-center" value="${state.otp}" maxlength="6" /><button data-action="verify-otp" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg">Verify</button></div>`;
    }
    function renderHome() { return `<div class="p-6 flex flex-col gap-6 h-full pb-20"><h2 class="text-3xl font-bold">Hi there,</h2><button data-action="nav-join" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg">Enter PG Code</button></div>`; }
    function renderJoin() { return `<div class="p-6"><button data-action="nav-home" class="text-blue-600 font-bold">← Back</button></div>`; }
    function renderActivation() { return `<div class="p-6"><h2 class="text-2xl font-bold">Onboarding</h2><button data-action="sign-agreement" class="w-full py-4 bg-gray-900 text-white mt-8 rounded-2xl">Skip & Activate</button></div>`; }

    function attachEvents() {
      const phoneInput = document.getElementById('phone-input');
      if (phoneInput) phoneInput.addEventListener('input', e => { state.phone = e.target.value.replace(/\D/g, '').slice(0, 10); render(); document.getElementById('phone-input').focus(); });
      const otpInput = document.getElementById('otp-input');
      if (otpInput) otpInput.addEventListener('input', e => { state.otp = e.target.value.replace(/\D/g, '').slice(0, 6); render(); document.getElementById('otp-input').focus(); });

      document.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', e => {
          const action = e.currentTarget.dataset.action;
          
          if (action === 'nav-tenant') state.screen = 'login';
          if (action === 'nav-persona') { state.screen = 'persona'; state.phoneStep = 1; state.phone = ''; state.otp = ''; state.overlay = null; state.activeTab = 'home'; }
          if (action === 'send-otp') state.phoneStep = 2;
          if (action === 'back-phone') state.phoneStep = 1;
          
          if (action === 'verify-otp') {
            if (state.otp === '999999') { state.screen = 'dashboard'; state.activeTab = 'home'; }
            else if (state.otp === '123456') { state.screen = 'activation'; state.actStep = 1; }
            else state.screen = 'home';
          }
          if (action === 'sign-agreement') { state.screen = 'dashboard'; state.activeTab = 'home'; }
          
          if (action === 'tab-home') state.activeTab = 'home';
          if (action === 'tab-rent') state.activeTab = 'rent';
          if (action === 'tab-profile') state.activeTab = 'profile';
          
          if (action === 'open-issues') state.overlay = 'issues';
          if (action === 'open-food') state.overlay = 'food';
          if (action === 'open-clean') state.overlay = 'clean';
          if (action === 'open-laundry') state.overlay = 'laundry';
          if (action === 'open-roomchange') { state.overlay = 'roomchange'; state.roomStep = 1; }
          if (action === 'open-moveout') { state.overlay = 'moveout'; state.moveStep = 1; }
          if (action === 'open-sos') { state.overlay = 'sos'; state.sosState = 'idle'; }
          if (action === 'open-leave') { state.overlay = 'leave'; state.leaveStep = 1; }
          if (action === 'open-inbox') { state.overlay = 'inbox'; }
          
          if (action === 'close-overlay') state.overlay = null;
          if (action === 'trigger-sos') state.sosState = 'sent';
          if (action === 'cancel-sos') { state.sosState = 'idle'; state.overlay = null; }
          if (action === 'submit-room') state.roomStep = 2;
          if (action === 'submit-move') state.moveStep = 2;
          if (action === 'submit-leave') state.leaveStep = 2;
          
          render();
        });
      });
    }

    render();
  </script>
</body>
</html>
